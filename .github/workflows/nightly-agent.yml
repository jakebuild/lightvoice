# Nightly roadmap agent: builds the environment like test.yml, then lets Claude
# Code take one `agent-ready` issue and open a pull request (AGENTS.md has the
# rules, .github/agent/nightly.md the prompt). It never merges or deploys.
#
# Off by default. To enable:
#   1. Install the Claude GitHub app on this repo (`/install-github-app` in
#      Claude Code). Its token makes the agent's PRs trigger the test workflow;
#      PRs opened with the default GITHUB_TOKEN would not.
#   2. Add the repository secret ANTHROPIC_API_KEY.
#   3. Set the repository variable NIGHTLY_AGENT to `on`.
#   4. Protect `main` (require a pull request and the `test` check) so nothing
#      reaches it without review.
name: nightly-agent

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 in Vietnam (UTC+7)
  workflow_dispatch:

concurrency:
  group: nightly-agent
  cancel-in-progress: false

jobs:
  agent:
    if: vars.NIGHTLY_AGENT == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ hashFiles('requirements.txt', 'scripts/prepare_assets.py') }}
          restore-keys: hf-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            vendor/sea-g2p/target
          key: cargo-${{ hashFiles('scripts/build_g2p.sh', 'vendor/sea-g2p-lightvoice.patch') }}
          restore-keys: cargo-

      - name: Build the environment
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          npm ci
          .venv/bin/python scripts/prepare_assets.py
          git checkout -- tests/golden   # regenerated binaries differ in the last bits per CPU
          npm run vendor
          npm run build:g2p
          npm run manifest

      - name: Git identity for the agent's commits
        run: |
          git config user.name "lightvoice-nightly"
          git config user.email "lightvoice-nightly@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            The environment is already built (Python venv, node_modules, web/models,
            web/vendor, web/g2p, web/assets.json); skip setup unless something is missing.

            Follow the instructions in .github/agent/nightly.md.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(.venv/bin/python:*),Bash(python3:*),Bash(uv:*),Bash(scripts/*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(diff:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*)"
